<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found — Savario Jenkins</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at 30% 30%, #10182f, #05070d 70%);
        color: #e9eefa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 32rem;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.1em;
        color: #4fe3ff;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 1rem;
        background: linear-gradient(120deg, #f4f7fc 40%, #9df3ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: #a9b4cc;
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 0 0 2rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        background: linear-gradient(120deg, #4fe3ff, #8c7bff);
        color: #05070d;
        font-weight: 700;
        text-decoration: none;
      }
      .core {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background: linear-gradient(120deg, #4fe3ff, #8c7bff);
        box-shadow: 0 0 40px 10px rgba(79, 227, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="core" aria-hidden="true"></div>
      <p class="code">SIGNAL LOST · 404</p>
      <h1>This path isn't part of the network.</h1>
      <p>
        The page you're looking for doesn't exist or has moved. Head back to the homepage to
        continue exploring.
      </p>
      <a class="button" href="/">Return Home</a>
    </div>
  </body>
</html>
